<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Freight Forecast</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <h1>Freight Forecast</h1>
        <p id="status">Checking backend...</p>
        <hr />

        <h2>Forecast Request</h2>

        <label>Route</label>
        <select id="route">
            <option value="C5">Route C5 (W. Australia -> India)</option>
            <option value="C3">Route C5 (Brazil -> India)</option>
            <option value="BCI">Route C5 (Overall Capesize Index)</option>
        </select>
        <br /><br/>

        <label>Forecast Horizon</label>
        <select id="horizon">
            <option value="7">7days</option>
            <option value="14">14days</option>
            <option value="30">30days</option>
        </select>

        <label>Iron Ore Price ($<span id="iron-ore-val">104</span>/tonne)</label><br/>
            <input type="range" id="iron-ore" min="50" max="200" value="104"
            oninput="document.getElementById('iron-ore-val').textContent = this.value" />
        <br/><br/>

            <label>Port Wait Days (<span id="port-wait-val">4.5</span> days)</label><br/>
            <input type="range" id="port-wait" min="0" max="15" step="0.5" value="4.5"
            oninput="document.getElementById('port-wait-val').textContent = this.value" />
        <br/><br/>

            <button onclick="runForecast()">Run Forecast</button>
            <p id="forecast-error"></p>

        <hr />

        <!-- Output area for forecast results -->
         <div id="output-selection" style="display:none;">
            <h2>Recommendation</h2>
            <p><strong>Action:</strong> <span id="action-text"></span> (<span id="urgency-text"></span> urgency)</p>
            <p id="rationale-text"></p>
              <p><strong>Current Spot Rate:</strong> <span id="current-rate"></span></p>
            <p><strong>95% Confidence Range:</strong> <span id="confidence-range"></span></p>

            <details>
                <summary>Raw JSON Response</summary>
                <pre id="raw-json"></pre>
            </details>

         </div>
    </body>
</html>
